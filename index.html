<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12392d">
  <meta name="description" content="오늘 가계부 안드로이드 앱 다운로드">
  <title>오늘 가계부 | 안드로이드 다운로드</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, "Malgun Gothic", sans-serif; color: #16352a; background: #eaf3ed; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 1rem; min-height: 100svh; display: grid; place-items: center; }
    main { width: min(100%, 31rem); border-radius: 1.5rem; background: #fff; box-shadow: 0 1rem 3rem #16352a14; overflow: hidden; }
    header { background: #12392d; color: #fff; padding: clamp(1.5rem, 6vw, 2.75rem); }
    h1 { font-size: clamp(2.2rem, 9vw, 3rem); line-height: 1.1; margin: 0 0 .75rem; letter-spacing: -.05em; }
    header p { color: #d8efe2; margin: 0; line-height: 1.6; }
    section { padding: clamp(1.5rem, 6vw, 2.75rem); }
    a { display: block; padding: 1rem; border-radius: .75rem; text-align: center; color: #fff; background: #1d654c; font-weight: 750; text-decoration: none; }
    a:hover { background: #144c39; }
    a:focus-visible { outline: 3px solid #1a6149; outline-offset: 4px; }
    .platform { margin: .75rem 0 1.5rem; text-align: center; color: #4d6459; font-size: .9rem; }
    .install { margin: 0; color: #30473c; line-height: 1.7; overflow-wrap: break-word; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>오늘 가계부</h1>
      <p>입금·송금·카드 결제 알림을 오늘의 거래 내역으로 정리해요.</p>
    </header>
    <section aria-label="앱 다운로드">
      <a href="./today-ledger.apk" download="오늘가계부.apk">갤럭시용 APK 다운로드</a>
      <p class="platform">Android 8.1 이상</p>
      <p class="install">갤럭시에서 다운로드한 뒤 <strong>내 파일 → 다운로드</strong>에서 APK를 열어 설치하세요.</p>
    </section>
  </main>
</body>
</html>
